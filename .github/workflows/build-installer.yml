name: Build SUSA Installer

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PRODUCT_VERSION: 1.0.0

jobs:
  build-cli:
    name: Build CLI Compiler
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Build C++ CLI
      working-directory: cpp-core
      run: |
        if (Test-Path "build") { Remove-Item -Recurse -Force build }
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release
        
    - name: Verify CLI build
      run: |
        Write-Host "=== Checking CLI Build Output ==="
        
        if (Test-Path "cpp-core/build/Release/susa.exe") {
          Write-Host "✓ CLI built successfully at: cpp-core/build/Release/susa.exe"
          Get-Item "cpp-core/build/Release/susa.exe"
          
          # Also check if it runs
          Write-Host "`nTesting CLI execution:"
          & "cpp-core/build/Release/susa.exe" --version
        } elseif (Test-Path "cpp-core/susa.exe") {
          Write-Host "✓ Using existing susa.exe at: cpp-core/susa.exe"
          Get-Item "cpp-core/susa.exe"
          
          # Copy to expected location for artifact
          Write-Host "`nCopying to build/Release directory..."
          New-Item -ItemType Directory -Force -Path "cpp-core/build/Release"
          Copy-Item "cpp-core/susa.exe" "cpp-core/build/Release/susa.exe"
        } else {
          Write-Error "✗ CLI build failed - susa.exe not found"
          Write-Host "`nSearching for any .exe files in cpp-core:"
          Get-ChildItem "cpp-core" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object FullName
          exit 1
        }
        
        Write-Host "`nFinal verification:"
        if (Test-Path "cpp-core/build/Release/susa.exe") {
          Write-Host "✓ susa.exe ready for artifact upload"
        } else {
          Write-Error "✗ susa.exe not in expected location"
          exit 1
        }
        
    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: susa-cli
        path: |
          cpp-core/build/Release/susa.exe
        retention-days: 1
      continue-on-error: false

  build-ide:
    name: Build IDE
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: susa-ide/remix-of-susa-studio-ide-main
      run: npm install
      
    - name: Build Vite app
      working-directory: susa-ide/remix-of-susa-studio-ide-main
      run: npm run build
      
    - name: Build Electron IDE
      working-directory: susa-ide/remix-of-susa-studio-ide-main
      run: npm run dist:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
        
    - name: Verify IDE build
      run: |
        Write-Host "Checking for IDE build outputs..."
        
        # Check dist-electron directory
        if (Test-Path "susa-ide/remix-of-susa-studio-ide-main/dist-electron") {
          Write-Host "✓ dist-electron directory found"
          Get-ChildItem "susa-ide/remix-of-susa-studio-ide-main/dist-electron" -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "  Found: $($_.FullName)"
          }
        }
        
        # Check for win-unpacked
        if (Test-Path "susa-ide/remix-of-susa-studio-ide-main/dist-electron/win-unpacked") {
          Write-Host "✓ win-unpacked directory found"
          Get-ChildItem "susa-ide/remix-of-susa-studio-ide-main/dist-electron/win-unpacked"
        } else {
          Write-Host "⚠ win-unpacked not found, checking alternatives..."
          Get-ChildItem "susa-ide/remix-of-susa-studio-ide-main/dist-electron" -ErrorAction SilentlyContinue
        }
        
    - name: Upload IDE artifact
      uses: actions/upload-artifact@v4
      with:
        name: susa-ide
        path: susa-ide/remix-of-susa-studio-ide-main/dist-electron/win-unpacked/**/*
        retention-days: 1
      continue-on-error: false

  create-installer:
    name: Create NSIS Installer
    needs: [build-cli, build-ide]
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download CLI artifact
      uses: actions/download-artifact@v4
      with:
        name: susa-cli
        path: cpp-core/build/Release
        
    - name: Download IDE artifact
      uses: actions/download-artifact@v4
      with:
        name: susa-ide
        path: susa-ide/remix-of-susa-studio-ide-main/dist-electron/win-unpacked
        
    - name: Verify downloaded artifacts
      run: |
        Write-Host "=== Verifying Downloaded Artifacts ==="
        
        # Check CLI
        Write-Host "`nCLI Artifact:"
        if (Test-Path "cpp-core/build/Release") {
          Get-ChildItem "cpp-core/build/Release" -Recurse
        } else {
          Write-Error "CLI directory not found!"
        }
        
        # Check IDE
        Write-Host "`nIDE Artifact:"
        if (Test-Path "susa-ide/remix-of-susa-studio-ide-main/dist-electron/win-unpacked") {
          Get-ChildItem "susa-ide/remix-of-susa-studio-ide-main/dist-electron/win-unpacked" | Select-Object -First 20
        } else {
          Write-Error "IDE directory not found!"
        }
        
        # Verify specific files exist
        Write-Host "`nVerifying required files:"
        $cliPath = "cpp-core/build/Release/susa.exe"
        if (Test-Path $cliPath) {
          Write-Host "✓ CLI found: $cliPath"
          Get-Item $cliPath
        } else {
          Write-Error "✗ CLI not found: $cliPath"
          Write-Host "Contents of cpp-core/build/Release:"
          Get-ChildItem "cpp-core/build/Release" -ErrorAction SilentlyContinue
        }
        
        $ideFiles = Get-ChildItem "susa-ide/remix-of-susa-studio-ide-main/dist-electron/win-unpacked" -ErrorAction SilentlyContinue
        if ($ideFiles) {
          Write-Host "✓ IDE files found: $($ideFiles.Count) items"
        } else {
          Write-Error "✗ IDE files not found"
        }
        
    - name: Create dist directory
      run: |
        New-Item -ItemType Directory -Force -Path dist
        
    - name: Install NSIS
      run: |
        choco install nsis -y
        
    - name: Copy branding assets
      run: |
        Write-Host "=== Copying Branding Assets ==="
        New-Item -ItemType Directory -Force -Path installer/assets
        
        # Copy icon from root
        if (Test-Path "susa logo.ico") {
          Copy-Item "susa logo.ico" "installer/assets/susa_icon.ico" -Force
          Write-Host "✓ Copied susa logo.ico → susa_icon.ico"
          $size = (Get-Item "installer/assets/susa_icon.ico").Length
          Write-Host "  Size: $size bytes"
        } else {
          Write-Error "✗ susa logo.ico not found in root!"
        }
        
        # Copy sidebar from susa-ide
        if (Test-Path "susa-ide/remix-of-susa-studio-ide-main/susa-sidebar.bmp") {
          Copy-Item "susa-ide/remix-of-susa-studio-ide-main/susa-sidebar.bmp" "installer/assets/susa_sidebar.bmp" -Force
          Write-Host "✓ Copied susa-sidebar.bmp → susa_sidebar.bmp"
          $size = (Get-Item "installer/assets/susa_sidebar.bmp").Length
          Write-Host "  Size: $size bytes"
        } else {
          Write-Error "✗ susa-sidebar.bmp not found!"
        }
        
        # Create header from logo PNG (convert to BMP)
        if (Test-Path "susa logo.png") {
          Write-Host "Creating header BMP from logo PNG..."
          
          # For now, create a simple header BMP
          # In production, you'd want to use the actual logo
          $width = 150
          $height = 57
          $rowSize = [Math]::Floor(($width * 3 + 3) / 4) * 4
          $pixelArraySize = $rowSize * $height
          $fileSize = 54 + $pixelArraySize
          
          $header = New-Object byte[] $fileSize
          
          # BMP File Header
          $header[0] = 0x42; $header[1] = 0x4D  # "BM"
          [BitConverter]::GetBytes([int32]$fileSize).CopyTo($header, 2)
          [BitConverter]::GetBytes([int32]54).CopyTo($header, 10)
          
          # DIB Header
          [BitConverter]::GetBytes([int32]40).CopyTo($header, 14)
          [BitConverter]::GetBytes([int32]$width).CopyTo($header, 18)
          [BitConverter]::GetBytes([int32]$height).CopyTo($header, 22)
          [BitConverter]::GetBytes([int16]1).CopyTo($header, 26)
          [BitConverter]::GetBytes([int16]24).CopyTo($header, 28)
          
          # Fill with SUSA brand colors (blue gradient)
          for ($y = 0; $y -lt $height; $y++) {
            $intensity = [int](50 + ($y / $height) * 150)
            for ($x = 0; $x -lt $width; $x++) {
              $offset = 54 + $y * $rowSize + $x * 3
              $header[$offset] = [Math]::Min(255, $intensity + 50)      # B
              $header[$offset + 1] = [Math]::Min(255, $intensity)       # G
              $header[$offset + 2] = [Math]::Max(0, $intensity - 50)    # R
            }
          }
          
          [System.IO.File]::WriteAllBytes("installer/assets/susa_header.bmp", $header)
          Write-Host "✓ Created susa_header.bmp (150x57)"
          $size = (Get-Item "installer/assets/susa_header.bmp").Length
          Write-Host "  Size: $size bytes"
        }
        
        # Verify all assets
        Write-Host "`n=== Verifying Assets ==="
        $assets = @("susa_icon.ico", "susa_header.bmp", "susa_sidebar.bmp")
        $allExist = $true
        foreach ($asset in $assets) {
          $path = "installer/assets/$asset"
          if (Test-Path $path) {
            $size = (Get-Item $path).Length
            Write-Host "✓ $asset ($([math]::Round($size/1KB, 2)) KB)"
          } else {
            Write-Error "✗ $asset missing!"
            $allExist = $false
          }
        }
        
        if (-not $allExist) {
          Write-Error "Some assets are missing!"
          exit 1
        }
        
        Write-Host "`n✓ All branding assets ready"
        
    - name: Build NSIS installer
      run: |
        Write-Host "=== Pre-build Directory Check ==="
        Write-Host "`nCurrent directory:"
        Get-Location
        
        Write-Host "`nDirectory structure:"
        Get-ChildItem -Recurse -Depth 2 | Where-Object { $_.PSIsContainer -or $_.Extension -eq ".exe" } | Select-Object FullName
        
        Write-Host "`nChecking paths relative to installer directory:"
        Push-Location installer
        
        $cliPath = "..\cpp-core\build\Release\susa.exe"
        $idePath = "..\susa-ide\remix-of-susa-studio-ide-main\dist-electron\win-unpacked"
        
        Write-Host "`nCLI path check: $cliPath"
        if (Test-Path $cliPath) {
          Write-Host "✓ CLI file exists"
          Get-Item $cliPath
        } else {
          Write-Error "✗ CLI file NOT found at: $cliPath"
          Write-Host "Searching for susa.exe:"
          Get-ChildItem .. -Recurse -Filter "susa.exe" | Select-Object FullName
        }
        
        Write-Host "`nIDE path check: $idePath"
        if (Test-Path $idePath) {
          Write-Host "✓ IDE directory exists"
          Get-ChildItem $idePath | Select-Object -First 10
        } else {
          Write-Error "✗ IDE directory NOT found at: $idePath"
          Write-Host "Searching for dist-electron:"
          Get-ChildItem .. -Recurse -Directory -Filter "dist-electron" | Select-Object FullName
        }
        
        Pop-Location
        
        Write-Host "`n=== Running NSIS ==="
        & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 installer/susa-installer.nsi
        
    - name: Verify installer
      run: |
        if (Test-Path "dist/SUSA-Setup.exe") {
          Write-Host "Installer created successfully"
          $size = (Get-Item "dist/SUSA-Setup.exe").Length / 1MB
          Write-Host "Installer size: $([math]::Round($size, 2)) MB"
        } else {
          Write-Error "Installer creation failed"
          exit 1
        }
        
    - name: Calculate checksums
      run: |
        $hash = Get-FileHash -Path "dist/SUSA-Setup.exe" -Algorithm SHA256
        $hash.Hash | Out-File -FilePath "dist/SUSA-Setup.exe.sha256"
        Write-Host "SHA256: $($hash.Hash)"
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: susa-installer
        path: |
          dist/SUSA-Setup.exe
          dist/SUSA-Setup.exe.sha256
        retention-days: 30
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/SUSA-Setup.exe
          dist/SUSA-Setup.exe.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-installer:
    name: Test Installer
    needs: create-installer
    runs-on: windows-latest
    
    steps:
    - name: Download installer
      uses: actions/download-artifact@v4
      with:
        name: susa-installer
        path: .
        
    - name: Test silent installation
      run: |
        Start-Process -FilePath "SUSA-Setup.exe" -ArgumentList "/S" -Wait
        
    - name: Verify installation
      run: |
        $cliPath = "C:\Program Files\SUSA\cli\susa.exe"
        $idePath = "C:\Program Files\SUSA\ide"
        
        if (Test-Path $cliPath) {
          Write-Host "✓ CLI installed successfully: $cliPath"
        } else {
          Write-Host "⚠ CLI not found at expected location"
          Get-ChildItem "C:\Program Files\SUSA" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
        }
        
        if (Test-Path $idePath) {
          Write-Host "✓ IDE directory exists: $idePath"
          Get-ChildItem $idePath -ErrorAction SilentlyContinue
        } else {
          Write-Host "⚠ IDE directory not found"
        }
        
    - name: Test uninstallation
      run: |
        $uninstaller = "C:\Program Files\SUSA\uninst.exe"
        if (Test-Path $uninstaller) {
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          Write-Host "Uninstallation completed"
        }
