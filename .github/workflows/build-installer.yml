name: Build SUSA Installer

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PRODUCT_VERSION: 1.0.0

jobs:
  build-cli:
    name: Build CLI Compiler
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Build C++ CLI
      working-directory: cpp-core
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release
        
    - name: Verify CLI build
      run: |
        if (Test-Path "cpp-core/build/Release/cpp-core.exe") {
          Write-Host "CLI build successful"
          cpp-core/build/Release/cpp-core.exe --version
        } else {
          Write-Error "CLI build failed"
          exit 1
        }
        
    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: susa-cli
        path: cpp-core/build/Release/cpp-core.exe
        retention-days: 1

  build-ide:
    name: Build IDE
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ide/package-lock.json
        
    - name: Install dependencies
      working-directory: ide
      run: npm ci
      
    - name: Build Electron IDE
      working-directory: ide
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify IDE build
      run: |
        if (Test-Path "ide/dist/win-unpacked") {
          Write-Host "IDE build successful"
          Get-ChildItem ide/dist/win-unpacked
        } else {
          Write-Error "IDE build failed"
          exit 1
        }
        
    - name: Upload IDE artifact
      uses: actions/upload-artifact@v4
      with:
        name: susa-ide
        path: ide/dist/win-unpacked/**/*
        retention-days: 1

  create-installer:
    name: Create NSIS Installer
    needs: [build-cli, build-ide]
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download CLI artifact
      uses: actions/download-artifact@v4
      with:
        name: susa-cli
        path: cli/build
        
    - name: Download IDE artifact
      uses: actions/download-artifact@v4
      with:
        name: susa-ide
        path: ide/dist/win-unpacked
        
    - name: Create dist directory
      run: |
        New-Item -ItemType Directory -Force -Path dist
        
    - name: Install NSIS
      run: |
        choco install nsis -y
        
    - name: Create placeholder assets
      run: |
        New-Item -ItemType Directory -Force -Path installer/assets
        
    - name: Build NSIS installer
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 installer/susa-installer.nsi
        
    - name: Verify installer
      run: |
        if (Test-Path "dist/SUSA-Setup.exe") {
          Write-Host "Installer created successfully"
          $size = (Get-Item "dist/SUSA-Setup.exe").Length / 1MB
          Write-Host "Installer size: $([math]::Round($size, 2)) MB"
        } else {
          Write-Error "Installer creation failed"
          exit 1
        }
        
    - name: Calculate checksums
      run: |
        $hash = Get-FileHash -Path "dist/SUSA-Setup.exe" -Algorithm SHA256
        $hash.Hash | Out-File -FilePath "dist/SUSA-Setup.exe.sha256"
        Write-Host "SHA256: $($hash.Hash)"
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: susa-installer
        path: |
          dist/SUSA-Setup.exe
          dist/SUSA-Setup.exe.sha256
        retention-days: 30
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/SUSA-Setup.exe
          dist/SUSA-Setup.exe.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-installer:
    name: Test Installer
    needs: create-installer
    runs-on: windows-latest
    
    steps:
    - name: Download installer
      uses: actions/download-artifact@v4
      with:
        name: susa-installer
        path: .
        
    - name: Test silent installation
      run: |
        Start-Process -FilePath "SUSA-Setup.exe" -ArgumentList "/S" -Wait
        
    - name: Verify installation
      run: |
        $cliPath = "C:\Program Files\SUSA\cli\cpp-core.exe"
        $idePath = "C:\Program Files\SUSA\ide\SUSA-IDE.exe"
        
        if (Test-Path $cliPath) {
          Write-Host "CLI installed successfully"
        } else {
          Write-Error "CLI not found"
          exit 1
        }
        
        if (Test-Path $idePath) {
          Write-Host "IDE installed successfully"
        } else {
          Write-Error "IDE not found"
          exit 1
        }
        
    - name: Test uninstallation
      run: |
        $uninstaller = "C:\Program Files\SUSA\uninst.exe"
        if (Test-Path $uninstaller) {
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          Write-Host "Uninstallation completed"
        }
